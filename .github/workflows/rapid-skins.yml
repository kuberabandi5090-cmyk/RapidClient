name: Build RAPID Skins mod

on:
  push:
    branches: [main]
    paths:
      - "rapid-skins/**"
      - ".github/workflows/rapid-skins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build Fabric mod
        working-directory: rapid-skins
        run: gradle --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rapid-skins-fabric-1.21.11
          path: rapid-skins/build/libs/rapid-skins-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish current mod build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rapid-skins-latest
          name: RAPID Skins — Fabric 1.21.11
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: rapid-skins/build/libs/rapid-skins-*.jar
